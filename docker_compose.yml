services:
  web:
    build: 
      context: .
      dockerfile: dockerfile
      platforms:
        - "linux/arm64"
        - "linux/amd64"
    volumes:
      - web_data:/var/www/html
      - ./backup_reportes:/app/reportes:rw
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8080:80
    env_file:
      - .env
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 200M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 10s
      retries: 3

  db:
    image: postgres:17-alpine
    volumes:
      - ./cromasdb.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/postgresql/data 
    restart: always
    expose:
      - 5432
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 10s
      retries: 3

volumes:
  db_data:
  web_data: