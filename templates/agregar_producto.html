<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pintuplomer</title>
    <link href="/static/css/output.css" rel="stylesheet" />
    <link href="/static/img/icono/pintuplomer_logo.ico" rel="shortcut icon" />
</head>
<body class="bg-slate-100 flex">

    {% include 'components/navegacion_if.html' %}

    <div class="w-full ml-96 p-4">
      <div class="flex items-center space-x-2 mb-4 justify-end">
        <p class="text-xl font-bold">{{ session.usuario_nombre }}</p>
        <img src="{{ url_for('static', filename='img/perfil/' + imagen) }}" class="w-17 rounded-full">
      </div>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flex flex-col space-y-2">
            {% for message in messages %}
              <p class="bg-red-200 text-red-800 p-2 mt-3 rounded-md text-center text-xl mb-2">{{ message }}</p>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <div>
          <h1 class="text-center mb-10 text-2xl text-slate-800">Nuevo Producto</h1> 
          <form class="bg-white mx-[270px] border-gray-300 shadow-md m-auto px-5 py-2 rounded-xl" action="{{ url_for('inventario.crear_producto') }}" method="POST" enctype="multipart/form-data">
              <label for="imagen" class="font-medium text-gray-700 text-xl">Imagen:</label> <br>
              <input type="file" name="imagen" id="imagen" required/> <br>
              <label for="nombre" class="text-xl font-medium text-gray-700 ">Nombre del producto:</label> <br>
              <input class="pl-2 my-2 bg-slate-100 rounded-sm w-55 " type="text" name="nombre" id="nombre" placeholder="Nombre del producto" required/> <br>
              <label for="detalles" class="text-xl font-medium text-gray-700">Descripcion:</label> <br>
              <input class="pl-2 my-2 bg-slate-100 rounded-sm w-55 " type="text" id="detalles" name="detalles" placeholder="Descripcion del producto"> <br>
              <label for="precio" class="text-xl font-medium text-gray-700">Precio:</label> <br>
              <input class="pl-2 my-2 bg-slate-100 rounded-sm w-55" type="number" id="precio" name="precio" placeholder="Precio del producto" required> <br>
              <label for="existencia" class="text-xl font-medium text-gray-700">Cantidad:</label> <br>
              <input class="pl-2 my-2 bg-slate-100 rounded-sm w-55" type="number" id="existencia" name="existencia" placeholder="Cantidad en existencia" required> <br> 
              <label for="distribuidor" class="text-xl font-medium text-gray-700">Seleccione un distribuidor:</label>
              {% if distribuidores %}
                <select class="pl-2 my-2 ml-1 bg-slate-100 rounded-sm " id="distribuidor" name="distribuidor">
                  {% for distribuidor in distribuidores %}
                  <option value="{{ distribuidor[0] }}">{{ distribuidor[1] }}</option>
                  {% endfor %}
                </select> <br> <br>
              {% endif %}
              <button type="submit" class="bg-green-500 p-1.5 rounded-xl cursor-pointer text-white hover:bg-green-600 mb-2" > Agregar Producto</button>
          </form>
      </div>
  </div>
</body>
</html>
