<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_title }} - Sistema de Gestión</title>
    <link href="/static/css/output.css" rel="stylesheet" />
    <link href="/static/img/icono/pintuplomer_logo.ico" rel="shortcut icon" />
</head>
<body class="min-h-screen text-slate-800 bg-slate-100 antialiased">

    <div class="block md:table w-full min-h-screen border-collapse">
        
    

        <main class="block md:table-cell vertical-top p-6 md:p-8">
            
            <header class="bg-white rounded-xl shadow-sm p-4 mb-6 flex justify-between items-center">
                <div class="text-slate-700 font-medium text-sm md:text-base">
                    Sistema de gestión de materiales de pintura
                </div>
                <div class="flex items-center">
                    <span class="text-xs font-semibold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-md">MODO SEGURO</span>
                </div>
            </header>

            <div class="max-w-xl mx-auto mt-12 bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                
                <div class="h-2 w-full {% if status_code == 500 %}bg-red-500{% elif status_code in [401, 403] %}bg-amber-500{% else %}bg-blue-500{% endif %}"></div>
                
                <div class="p-6 md:p-8 text-center">
                    <h1 class="text-6xl font-black text-slate-900 tracking-tight mb-2">
                        {{ status_code }}
                    </h1>
                    
                    <h2 class="text-xl font-bold text-slate-800 mb-4">
                        {{ error_title }}
                    </h2>
                    
                    <p class="text-sm md:text-base text-slate-500 leading-relaxed mb-8 max-w-sm mx-auto">
                        {{ error_message }}
                    </p>
                    
                    <div class="flex justify-center">
                        <a href="{{ url_for('dashboard.dashboard') }}" class="inline-flex items-center justify-center px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg shadow-sm transition-colors duration-150 group">
                            <svg class="w-4 h-4 mr-2 transform group-hover:-translate-x-1 transition-transform duration-150" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                            </svg>
                            Volver a la Vista General
                        </a>
                    </div>
                </div>
            </div>

            <footer class="mt-[18%] text-center text-xs text-slate-400">
                <p >© Pintuplomer.</p>
            </footer>

        </main>
    </div>

</body>
</html>
